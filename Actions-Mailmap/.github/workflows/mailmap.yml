name: Batch Replace Commit Email in All Public Repos

on:
  workflow_dispatch:
    inputs:
      github_token:
        description: "具有 repo 和 workflow 权限的 GitHub Token (PAT)"
        required: true
        type: string
      old_emails:
        description: "需要替换的旧邮箱地址，支持多个（用英文逗号、分号或空格分隔）"
        required: true
        default: "160479206+lingyicute@users.noreply.github.com,lingyicute@users.noreply.github.com"
        type: string
      new_email:
        description: "替换后的新邮箱地址 (New Email)"
        required: true
        default: "xlyxinglinyi@gmail.com"
        type: string
      new_name:
        description: "（可选）同时替换匹配邮箱的作者/提交者名称，留空则保留原名称"
        required: false
        default: ""
        type: string
      include_forks:
        description: "是否包含 Fork 的公开仓库"
        required: false
        default: false
        type: boolean

concurrency:
  group: replace-email-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  rewrite-and-force-push:
    name: 批量替换公开仓库提交邮箱并 Force Push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      OWNER: ${{ github.repository_owner }}
      CURRENT_REPO: ${{ github.event.repository.name }}
      OLD_EMAILS: ${{ inputs.old_emails }}
      NEW_EMAIL: ${{ inputs.new_email }}
      NEW_NAME: ${{ inputs.new_name }}
      INCLUDE_FORKS: ${{ inputs.include_forks }}
    steps:
      - name: 校验参数并安装依赖
        run: |
          echo "::add-mask::${GH_TOKEN}"
          read -r -a OLD_EMAIL_LIST <<< "$(tr ',;\n\r\t' ' ' <<< "$OLD_EMAILS")"
          if [[ -z "$GH_TOKEN" || ${#OLD_EMAIL_LIST[@]} -eq 0 || -z "$NEW_EMAIL" ]]; then
            echo "::error::参数无效：Token、新旧邮箱均不能为空。"
            exit 1
          fi
          for email in "${OLD_EMAIL_LIST[@]}"; do
            if [[ "$email" == "$NEW_EMAIL" ]]; then
              echo "::error::参数无效：旧邮箱 (${email}) 不能与新邮箱相同。"
              exit 1
            fi
          done
          sudo apt-get update && sudo apt-get install -y git-filter-repo

      - name: 批量替换邮箱并 Force Push
        run: |
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          STATUS_DIR="${WORKDIR}/status"
          LOG_DIR="${WORKDIR}/logs"
          mkdir -p "$STATUS_DIR" "$LOG_DIR"

          read -r -a OLD_EMAIL_LIST <<< "$(tr ',;\n\r\t' ' ' <<< "$OLD_EMAILS")"

          MAILMAP="${WORKDIR}/mailmap"
          PATTERNS_FILE="${WORKDIR}/old_emails.txt"
          : > "$MAILMAP"
          : > "$PATTERNS_FILE"

          for email in "${OLD_EMAIL_LIST[@]}"; do
            printf '%s\n' "$email" >> "$PATTERNS_FILE"
            if [[ -n "$NEW_NAME" ]]; then
              printf '%s <%s> <%s>\n' "$NEW_NAME" "$NEW_EMAIL" "$email" >> "$MAILMAP"
            else
              printf '<%s> <%s>\n' "$NEW_EMAIL" "$email" >> "$MAILMAP"
            fi
          done

          # 获取所有非空、未归档的公开仓库，并将当前工作流所在仓库排在最后
          REPOS=$(gh repo list "$OWNER" --visibility public --no-archived --limit 1000 \
            --json name,isEmpty,isFork \
            --jq "map(select((.isEmpty | not) and (${INCLUDE_FORKS:-false} or (.isFork | not)))) | sort_by(.name == \"$CURRENT_REPO\") | .[].name")

          REPOS_LIST=()
          if [[ -n "$REPOS" ]]; then
            mapfile -t REPOS_LIST <<< "$REPOS"
          fi

          process_repo() {
            local REPO="$1"
            local REPO_DIR="${WORKDIR}/${REPO}.git"
            local REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git"
            local STATUS_FILE="${STATUS_DIR}/${REPO}.status"

            echo "=== 处理仓库: ${OWNER}/${REPO} ==="

            if ! git clone --bare "$REMOTE_URL" "$REPO_DIR"; then
              echo "::warning::克隆 ${OWNER}/${REPO} 失败"
              echo "failed:${REPO} (clone failed)" > "$STATUS_FILE"
              rm -rf "$REPO_DIR"
              return 0
            fi

            # 仅当仓库存在匹配任一旧邮箱的提交时才执行重写与强推
            if ! git -C "$REPO_DIR" log --all --format='%ae%n%ce' | grep -Fixq -f "$PATTERNS_FILE"; then
              echo "未检测到旧邮箱记录，跳过。"
              echo "skipped" > "$STATUS_FILE"
              rm -rf "$REPO_DIR"
              return 0
            fi

            if git -C "$REPO_DIR" filter-repo --force --mailmap "$MAILMAP" && \
               git -C "$REPO_DIR" push --force "$REMOTE_URL" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'; then
              echo "success" > "$STATUS_FILE"
            else
              echo "::warning::${OWNER}/${REPO} 重写或 Force Push 失败"
              echo "failed:${REPO} (push failed)" > "$STATUS_FILE"
            fi

            rm -rf "$REPO_DIR"
          }

          SUCCESS=0; SKIPPED=0; FAILED=()
          BATCH_SIZE=16
          TOTAL=${#REPOS_LIST[@]}

          # 十六个一组并发执行
          for (( i = 0; i < TOTAL; i += BATCH_SIZE )); do
            BATCH=("${REPOS_LIST[@]:i:BATCH_SIZE}")
            echo "=== 并发处理第 $(( i / BATCH_SIZE + 1 )) 组（共 ${#BATCH[@]} 个仓库） ==="

            for REPO in "${BATCH[@]}"; do
              process_repo "$REPO" > "${LOG_DIR}/${REPO}.log" 2>&1 &
            done
            wait

            for REPO in "${BATCH[@]}"; do
              cat "${LOG_DIR}/${REPO}.log"
              STATUS=$(cat "${STATUS_DIR}/${REPO}.status" 2>/dev/null || echo "failed:${REPO} (unknown error)")
              case "$STATUS" in
                success)
                  SUCCESS=$((SUCCESS + 1))
                  ;;
                skipped)
                  SKIPPED=$((SKIPPED + 1))
                  ;;
                failed:*)
                  FAILED+=("${STATUS#failed:}")
                  ;;
              esac
            done
          done

          printf -v OLD_EMAILS_DISPLAY '%s, ' "${OLD_EMAIL_LIST[@]}"
          OLD_EMAILS_DISPLAY="${OLD_EMAILS_DISPLAY%, }"

          {
            echo "## 批量替换提交邮箱执行汇总"
            echo "- **所有者**: \`${OWNER}\` | **邮箱替换**: \`${OLD_EMAILS_DISPLAY}\` -> \`${NEW_EMAIL}\`"
            echo "- **成功更新**: ${SUCCESS} | **跳过(无匹配邮箱)**: ${SKIPPED} | **失败**: ${#FAILED[@]}"
            if (( ${#FAILED[@]} > 0 )); then
              echo ""
              echo "### 失败仓库"
              printf -- '- `%s`\n' "${FAILED[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          (( ${#FAILED[@]} == 0 ))
